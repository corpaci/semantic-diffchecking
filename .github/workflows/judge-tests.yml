name: Judge interfaces

on:
  pull_request:
    paths:
      - 'judge/**'
      - 'pipeline/**'
      - 'configs/**'
      - 'tests/**'
      - '.github/workflows/judge-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python -m pipeline.run --config configs/judge-v0-baseline.yaml --stage all --dry-run
      - run: python -m pipeline.run --config configs/rep-lean.yaml --stage all --dry-run
      - run: python -m judge --help
